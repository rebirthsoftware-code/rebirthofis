<title>Rebirth Ofis</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  /* Layout: koyu zemin üzerinde izometrik ofis sahnesi; yanında (telefonda altında) görev paneli. */
  :root {
    --bg: #0b0b10;
    --bg-2: #13131a;
    --panel: #15151d;
    --panel-2: #1d1d27;
    --line: rgba(255,255,255,.09);
    --fg: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #f5a524;
    --accent-ink: #1a1203;
    --ok: #22c55e;
    --info: #60a5fa;
    --warn: #fbbf24;
    --bad: #f87171;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-head: "Space Grotesk", "Inter", system-ui, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: radial-gradient(1100px 600px at 25% 15%, #171722 0%, var(--bg) 60%);
    color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  }
  button, input, textarea, select { font: inherit; color: inherit; }
  .app { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 900px) {
    .app { height: 100%; grid-template-columns: minmax(0, 1fr) 400px; }
    .panel { height: 100%; overflow-y: auto; border-left: 1px solid var(--line); border-top: none !important; }
  }

  /* Sahne */
  .stage {
    position: relative; display: flex; flex-direction: column; min-width: 0;
    padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    min-height: 54vh;
  }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .eyebrow { font-size: 10px; letter-spacing: 3px; color: var(--muted); font-weight: 600; }
  h1 { margin: 0; font-family: var(--font-head); font-size: 22px; letter-spacing: .3px; line-height: 1.1; }
  .stats { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .stat, .badge { font-size: 11px; padding: 4px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge.live { color: #86efac; border-color: rgba(34,197,94,.45); }
  .badge.mock { color: var(--warn); border-color: rgba(251,191,36,.45); }
  .badge.wait { color: var(--muted); }
  .office-wrap { flex: 1; min-height: 0; display: flex; }
  .office { flex: 1; width: 100%; min-height: 300px; height: 100%; display: block; }
  @media (max-width: 899px) {
    /* Telefonda ofis kaydırılarak gezilir: dar ekrana sığdırmak yerine okunur boyutta tutulur */
    .office-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px))); }
    .office { min-width: 760px; height: 46vh; min-height: 320px; }
  }
  .emp-card {
    position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 14px; width: 320px; max-width: calc(100% - 32px);
    background: rgba(21,21,29,.96); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 13px;
    backdrop-filter: blur(8px); z-index: 2;
  }
  .emp-card .head { display: flex; gap: 10px; align-items: center; }
  .emp-card .head > div { flex: 1; min-width: 0; }
  .emp-card .swatch { width: 10px; height: 28px; border-radius: 4px; flex: none; }
  .emp-card p { margin: 8px 0; }
  .x { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }

  /* Panel */
  .panel {
    background: var(--panel); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 18px;
    padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h2 { font-size: 11px; margin: 0 0 8px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .form { display: flex; flex-direction: column; gap: 8px; }
  input[type=text], textarea, select {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--fg);
  }
  textarea { resize: vertical; min-height: 96px; }
  input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: transparent; border: 1px dashed var(--line); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 11px; cursor: pointer; }
  .chip:hover { color: var(--fg); border-color: var(--muted); }
  .primary { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
  .ghost:hover { color: var(--fg); }
  .tier { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); min-width: 0; max-width: 100%; }
  .tier select { width: auto; min-width: 0; max-width: 100%; padding: 6px 28px 6px 10px; font-size: 12px; text-overflow: ellipsis; }
  .panel, .detail, .card, .form { min-width: 0; }
  .note { font-size: 12px; color: var(--muted); }
  .error { color: #fecaca; font-size: 12px; background: rgba(248,113,113,.12); border-radius: 6px; padding: 8px 10px; }

  .tasks ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .tasks li { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .tasks li:hover { background: var(--panel-2); }
  .tasks li.active { background: var(--panel-2); border-color: var(--line); }
  .tasks .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .time { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .status { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; text-transform: uppercase; letter-spacing: .5px; }
  .status.planning { color: var(--warn); border-color: rgba(251,191,36,.5); }
  .status.awaiting { color: var(--accent); border-color: rgba(245,165,36,.6); }
  .status.running, .status.collecting, .status.checking, .status.revising { color: #86efac; border-color: rgba(34,197,94,.5); }
  .status.done { color: #93c5fd; border-color: rgba(96,165,250,.5); }
  .status.failed { color: #fca5a5; border-color: rgba(248,113,113,.5); }

  .detail { border-top: 1px solid var(--line); padding-top: 14px; }
  .detail .head { display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .detail h3 { margin: 0; font-family: var(--font-head); font-size: 16px; text-wrap: balance; }
  .brief { color: var(--muted); font-size: 13px; white-space: pre-wrap; margin: 8px 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .tabs button { background: none; border: none; color: var(--muted); padding: 8px 10px; cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }
  .tabs button:disabled { opacity: .4; cursor: default; }
  .step { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--panel-2); font-size: 13px; }
  .step summary { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; cursor: pointer; list-style: none; }
  .step summary::-webkit-details-marker { display: none; }
  .phase { font-size: 10px; background: #2a2a36; color: var(--muted); padding: 2px 6px; border-radius: 4px; }
  .who { color: var(--accent); font-weight: 600; white-space: nowrap; font-size: 12px; }
  .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { font-size: 10px; padding: 2px 8px; border-radius: 999px; background: #2a2a36; color: var(--muted); }
  .pill.running { background: rgba(34,197,94,.15); color: #86efac; }
  .pill.done { background: rgba(96,165,250,.15); color: #93c5fd; }
  .pill.failed { background: rgba(248,113,113,.15); color: #fca5a5; }
  .instruction { padding: 0 10px 10px; color: var(--muted); font-size: 12px; }
  .log { list-style: none; padding: 0; margin: 0; font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
  .log li { display: flex; gap: 8px; align-items: baseline; }
  .md { font-size: 13px; line-height: 1.55; padding: 0 10px 10px; min-width: 0; overflow-wrap: anywhere; }
  .md.report { padding: 0; }
  .md h1, .md h2, .md h3 { color: var(--fg); text-transform: none; letter-spacing: 0; margin: 14px 0 6px; font-family: var(--font-head); }
  .md h1 { font-size: 18px; } .md h2 { font-size: 16px; } .md h3 { font-size: 14px; }
  .md pre { background: #0b0b10; border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12px; }
  .md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .md table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md.stream::after { content: "▍"; color: var(--accent); animation: blink 1s infinite; }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field > span { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
  .field > span b { color: var(--accent); font-weight: 700; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  .card { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
  .card h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .card ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .card li { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 6px; }
  .mark-ok { color: #86efac; font-weight: 700; } .mark-bad { color: #fca5a5; font-weight: 700; } .mark-q { color: var(--muted); font-weight: 700; }
  .spec { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 3px 10px; font-size: 12px; color: var(--muted); margin: 8px 0; }
  .spec dt { color: var(--fg); font-weight: 600; } .spec dd { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .file { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); padding: 10px 12px; margin-bottom: 8px; }
  .file .name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }
  .file .meta { font-size: 11px; color: var(--muted); }
  .preview { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; }
  .preview iframe { display: block; width: 100%; height: 440px; border: 0; background: #fff; }
  .svgprev { display: flex; gap: 14px; align-items: center; padding: 12px; background: #fff; color: #111; flex-wrap: wrap; }
  .svgprev .big { flex: 1; min-width: 0; } .svgprev .big svg { max-width: 100%; height: auto; max-height: 260px; display: block; }
  .svgprev .small { width: 32px; height: 32px; flex: none; outline: 1px dashed #bbb; } .svgprev .small svg { width: 32px; height: 32px; display: block; }
  .svgprev .cap { font-size: 10px; color: #666; }
  .warnline { color: var(--warn); font-size: 12px; }

  /* Ofis animasyonları */
  .emp .body { transform-box: fill-box; transform-origin: 50% 100%; }
  .emp.working .body, .emp.planning .body, .emp.collecting .body { animation: bob .9s ease-in-out infinite; }
  .emp.reviewing .body { animation: sway 2.4s ease-in-out infinite; }
  .pulse { animation: pulse 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .dots circle { animation: blink 1.2s infinite; }
  .dots circle:nth-child(2) { animation-delay: .2s; }
  .dots circle:nth-child(3) { animation-delay: .4s; }
  .screen-on { animation: flicker 2.2s ease-in-out infinite; }
  .zz { animation: float 2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes sway { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .5; transform: scale(1.4); } }
  @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }
  @keyframes flicker { 0%,100% { opacity: .9; } 50% { opacity: .7; } }
  @keyframes float { 0%,100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(-4px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

<div class="app">
  <main class="stage">
    <div class="top">
      <div>
        <div class="eyebrow">YAPAY ZEKA YAZILIM OFİSİ</div>
        <h1>Rebirth Ofis</h1>
      </div>
      <div class="stats">
        <span class="badge wait" id="modeBadge">Bağlanıyor…</span>
        <span class="stat" id="statEmp">16 çalışan</span>
        <span class="stat" id="statActive">0 aktif</span>
        <span class="stat" id="statOpen">0 açık görev</span>
      </div>
    </div>
    <div class="office-wrap" id="officeWrap"><svg class="office" id="office" role="img" aria-label="İzometrik ofis görünümü"></svg></div>
    <aside class="emp-card" id="empCard" hidden></aside>
  </main>

  <section class="panel">
    <form class="form" id="newTask">
      <h2>Yeni iş ver</h2>
      <div class="chips" id="templates" aria-label="Hazır iş türleri"></div>
      <label class="field"><span><b>1</b>İş</span>
        <input type="text" id="title" placeholder="Ne teslim edilecek, tek cümle. Örn: Berberim için tek sayfalık randevu sitesi" maxlength="300" required></label>
      <label class="field"><span><b>2</b>Kim için</span>
        <input type="text" id="audience" placeholder="Müşteri ya da izleyici kim?" maxlength="300"></label>
      <label class="field"><span><b>3</b>Malzeme</span>
        <textarea id="material" placeholder="Elindeki metin, not, tablo, örnek. Anlatmak yerine yapıştır."></textarea></label>
      <label class="field"><span><b>4</b>Teslim biçimi</span>
        <input type="text" id="format" placeholder="Dosya türü, ölçü, adet. Örn: tek HTML dosyası" maxlength="300"></label>
      <label class="field"><span><b>5</b>Kabul ölçütü</span>
        <input type="text" id="acceptance" placeholder="İşin bittiğini neye bakarak anlayacaksın?" maxlength="600"></label>
      <div class="row">
        <label class="tier">Model
          <select id="depth">
            <option value="kucuk">Küçük iş · Opus 5.5</option>
            <option value="teslim" selected>Teslimlik iş · Fable 5.2</option>
            <option value="uzun">Uzun iş · Fable 5.2 High</option>
          </select>
        </label>
        <button type="submit" class="primary" id="send">Ofise gönder</button>
      </div>
      <label class="check"><input type="checkbox" id="planFirst" checked> Başlamadan önce planı bana göster</label>
      <div class="note" id="costNote"></div>
      <div class="error" id="formError" hidden></div>
    </form>

    <div class="tasks">
      <h2>İşler</h2>
      <div class="note" id="tasksEmpty">Henüz iş yok. Yukarıdan ilk işi ver; ofis canlanacak.</div>
      <ul id="taskList"></ul>
    </div>

    <div class="detail" id="detail" hidden></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
<script>
(() => {
  "use strict";

  /* ============ KADRO ============ */
  const OFFICE_NAME = "Rebirth Ofis";
  const RULES = `
Çalışma kuralların:
- Türkçe yaz. Teknik terimleri olduğu gibi bırakabilirsin.
- Sana hedef ve kabul ölçütü verilir; yolu sen bulursun. Teslimin bir müşterinin kabul edeceği düzeyde olmalı.
- İnternete erişimin yok. Güncel veri, fiyat ya da kaynak gerektiren yerde uydurma; "doğrulanmadı" diye işaretle ve nereden doğrulanacağını yaz. Emin olmadığın yeri emin değilim diye belirt.
- Hazır görsel, dış bağlantılı resim, hazır şablon ya da dış kütüphane kullanma; gereken her şeyi kendin yaz ve çiz.
- Varsayım yaptıysan tek cümleyle söyle.`;

  const DEPARTMENTS = [
    { id: "yonetim", name: "Yönetim", color: "#f59e0b", x: 0, y: 0, w: 4, h: 2 },
    { id: "urun", name: "Ürün ve Tasarım", color: "#ec4899", x: 4, y: 0, w: 3, h: 2 },
    { id: "devops", name: "DevOps ve Veri", color: "#06b6d4", x: 7, y: 0, w: 3, h: 2 },
    { id: "gelistirme", name: "Yazılım Geliştirme", color: "#22c55e", x: 0, y: 2, w: 4, h: 3 },
    { id: "kalite", name: "Kalite ve Güvenlik", color: "#8b5cf6", x: 4, y: 2, w: 3, h: 3 },
    { id: "pazarlama", name: "Pazarlama ve Müşteri", color: "#3b82f6", x: 7, y: 2, w: 3, h: 3 },
    { id: "finans", name: "Finans", color: "#eab308", x: 0, y: 5, w: 3, h: 2 },
    { id: "yedek", name: "Yedek", color: "#94a3b8", x: 3, y: 5, w: 2, h: 2 },
    { id: "dinlenme", name: "Dinlenme Alanı", color: "#64748b", x: 5, y: 5, w: 5, h: 2, kind: "rest" },
  ];

  const E = (id, name, role, dept, desk, skills, about, extra) => ({ id, name, role, dept, desk, skills, prompt: `Sen "${OFFICE_NAME}" ofisinde ${role} olarak çalışıyorsun. ${about}${RULES}`, ...extra });
  const EMPLOYEES = [
    E("genel-mudur", "Genel Müdür", "Genel Müdür", "yonetim", [0.8, 0.9], "İşi brife çevirir, doğru çalışana dağıtır, teslimleri tek raporda toplar.",
      "Gelen işi teslim edilebilir parçalara bölersin, her parçayı en uygun çalışana net bir hedef ve kabul ölçütüyle verirsin, sonunda teslimleri iş sahibine dürüstçe raporlarsın.", { manager: true }),
    E("proje-yoneticisi", "Proje Yöneticisi", "Proje Yöneticisi", "yonetim", [2.6, 0.9], "Kapsam, zaman planı, risk listesi, sprint ve görev kırılımı.",
      "Kapsam belirleme, iş kırılımı, sprint planı, risk analizi ve kabul kriterleri konusunda uzmansın."),
    E("urun-analisti", "Ürün Analisti", "Ürün Analisti", "urun", [0.8, 0.9], "Gereksinim analizi, kullanıcı hikâyeleri, rakip ve pazar değerlendirmesi.",
      "İş fikrini kullanıcı hikâyelerine, önceliklendirilmiş gereksinimlere ve pazar değerlendirmesine dönüştürürsün."),
    E("uiux", "UI/UX Tasarımcı", "UI/UX Tasarımcı", "urun", [2.2, 0.9], "Ekran akışları, sayfa yapısı, bileşenler, erişilebilirlik, sunum kurgusu.",
      "Ekran akışlarını, sayfa yapılarını ve sunum kurgusunu tasarlarsın; mobil uyumu ve okunabilirliği gözetirsin."),
    E("devops", "DevOps Mühendisi", "DevOps Mühendisi", "devops", [0.8, 0.9], "CI/CD, Docker, bulut altyapısı, izleme, dağıtım.",
      "CI/CD hatları, Docker yapılandırmaları, bulut mimarisi ve dağıtım stratejileri üretirsin; çalıştırılabilir dosya ve komut verirsin."),
    E("veri", "Veri Analisti", "Veri Analisti", "devops", [2.2, 0.9], "Veri analizi, CSV/tablo inceleme, bulgu raporu, belgeden tabloya çıkarma, SQL ve şema.",
      "Verideki eksik ve tutarsız yerleri önce söyler, her bulgunun yanına dayandığı rakamı yazarsın. Okuyamadığın ya da emin olmadığın hücreyi boş bırakıp nedenini yazarsın, tahmin etmezsin."),

${briefBlock(task)}

${FILE_RULE}

  const fixPrompt = (task, step, previous, note, who) => `${EMP[step.employeeId].prompt}

${briefBlock(task)}

Teslim edilecek: ${step.deliverable || step.title}

${SELF_CHECK}`;

  const clip = (s, n) => (s.length > n ? s.slice(0, n) + "\n…(devamı kontrol için kısaltıldı)" : s);

  const reviewPrompt = (task, plan, outputs, auto) => `${QA.prompt}

${briefBlock(task)}

${plan.steps.map((s) => `- ${s.id} | ${EMP[s.employeeId].name} | ${s.deliverable || s.title} | ölçüt: ${(s.acceptance || []).join("; ") || "-"}`).join("\n")}

## Teslimler
${outputs.map((p) => `### ${p.step.id} - ${EMP[p.step.employeeId].name} - ${p.step.title}\n${clip(p.output, 60000)}`).join("\n\n")}

## Otomatik bulgular

## Dört yerden bak

  const reportPrompt = (task, plan, outputs, review, files) => `${MANAGER.prompt}

Ekip işi teslim etti. İş sahibine kısa ve dürüst bir teslim raporu yaz.

${briefBlock(task)}

## Teslimler
${outputs.map((p) => `### ${EMP[p.step.employeeId].name} - ${p.step.title}\n${clip(p.output, 40000)}`).join("\n\n")}

## Teslim dosyaları (iş sahibi bunları "Teslimler" sekmesinde açıp indirebiliyor)
${files.length ? list(files.map((f) => f.name)) : "- (dosya teslimi yok)"}

## Teslim kontrolünün sonucu
${review ? JSON.stringify({ passed: review.passed, checks: review.checks, fixesApplied: review.fixes }) : "(kontrol yapılamadı)"}

## Rapor biçimi
1. **Sonuç**: iş kabul ölçütünü karşılıyor mu, tek paragraf. Karşılamıyorsa bunu ilk cümlede söyle.
2. **Teslim edilenler**: istenen parçaları tek tek say, her birinin yanına teslim edildi ya da eksik yaz.

Dosyaların içeriğini rapora kopyalama; adlarıyla an. Metin teslimi varsa (çeviri, analiz gibi) sonucu raporda ver. Olmayan bir şeyi olmuş gibi yazma.`;

  const reportFixPrompt = (task, previous, note, changed) => `${MANAGER.prompt}

${briefBlock(task)}

## Önceki raporun
${previous}
${changed ? `

${changed}` : ""}

Raporu yalnızca notun ve değişen teslimin gerektirdiği yerlerde güncelle; geri kalanını aynen koru. Raporun tamamını yeniden ver.`;

  function normalizePlan(input, task) {
    if (!input || !Array.isArray(input.steps) || !input.steps.length) throw new Error("Plan boş geldi");
    const arr = (v) => (Array.isArray(v) ? v.map(String).filter(Boolean).slice(0, 8) : v ? [String(v)] : []);
    const steps = input.steps.slice(0, 5).map((s, i) => {
      let id = String(s.employeeId || "");
      if (!EMP[id] || EMP[id].manager) {
        const byName = EMPLOYEES.find((e) => !e.manager && (e.name.toLowerCase() === id.toLowerCase() || e.role.toLowerCase() === id.toLowerCase()));
        id = byName ? byName.id : "yedek";
      }
      return { id: "s" + (i + 1), employeeId: id, title: String(s.title || "Adım " + (i + 1)).trim(), deliverable: String(s.deliverable || ""), instruction: String(s.instruction || ""), format: String(s.format || ""), acceptance: arr(s.acceptance), phase: Math.max(1, Math.round(Number(s.phase) || 1)) };
    });
    const uniq = [...new Set(steps.map((s) => s.phase))].sort((a, b) => a - b);
    for (const s of steps) s.phase = uniq.indexOf(s.phase) + 1;
    const sp = task.spec || {};
    const acceptance = arr(input.acceptance);
    return { summary: String(input.summary || ""), audience: sp.audience || String(input.audience || ""), format: sp.format || String(input.format || ""), acceptance: acceptance.length ? acceptance : arr(sp.acceptance), steps };
  }

  /* ============ TESLİM DOSYALARI ============ */
  const EXT = { html: "html", svg: "svg", csv: "csv", md: "md", markdown: "md", json: "json", txt: "txt", xml: "svg" };
  function extractFiles(text, prefix) {
    const out = [];
    if (!text) return out;
    const re = /```([a-zA-Z0-9]+)[^\n]*\n([\s\S]*?)```/g;
    let m, n = 0;
    while ((m = re.exec(text))) {
      const lang = m[1].toLowerCase();
      const before = text.slice(Math.max(0, m.index - 200), m.index);
      const labels = [...before.matchAll(/Dosya:\s*[`*]*([\w\-.]+\.[a-zA-Z0-9]+)/g)];
      const label = labels.length ? labels[labels.length - 1][1] : null;
      let ext = EXT[lang];
      if (lang === "xml" && !/<svg[\s>]/.test(m[2])) ext = null;
      if (!label && !["html", "svg", "csv"].includes(ext || "")) continue;
      const labelExt = label ? label.split(".").pop().toLowerCase() : null;
      if (label && !["html", "svg", "csv", "md", "json", "txt"].includes(labelExt)) continue;
      n++;
      out.push({ name: label || `${prefix || "teslim"}-${n}.${ext}`, ext: labelExt || ext, content: m[2].replace(/\s+$/, "") + "\n" });
    }
    return out;
  }
  function taskFiles(task) {
    const byName = new Map();
    for (const s of task.plan ? task.plan.steps : []) {
      const r = (task.results || []).find((x) => x.stepId === s.id);
      if (!r || !r.output || r.status === "running") continue;
      for (const f of extractFiles(r.output, s.employeeId)) byName.set(f.name, { ...f, stepId: s.id, by: s.employeeId });
    }
    return [...byName.values()];
  }
  /* Model çağırmadan yakalanabilen bozuk dosya belirtileri */
  function autoFindings(outputs) {
    const found = [];
    for (const p of outputs) {
      const who = `${p.step.id} (${EMP[p.step.employeeId].name})`;
      if ((p.output.match(/```/g) || []).length % 2 === 1) found.push(`${who}: bir kod bloğu kapanmamış, dosya yarım kalmış olabilir.`);
      if (p.truncated) found.push(`${who}: yanıt uzunluk sınırına takıldı.`);
      for (const f of extractFiles(p.output, p.step.employeeId)) {
        if (f.ext === "html" && !/<\/html>\s*$/i.test(f.content.trim()) && /<html[\s>]/i.test(f.content)) found.push(`${who}: ${f.name} </html> ile bitmiyor, yarım kalmış olabilir.`);
        if (f.ext === "html" && /(src|href)\s*=\s*["']https?:\/\//i.test(f.content)) found.push(`${who}: ${f.name} dışarıdan kaynak yüklüyor; tek başına açılmayabilir.`);
        if (f.ext === "svg" && !/<\/svg>\s*$/i.test(f.content.trim())) found.push(`${who}: ${f.name} </svg> ile bitmiyor.`);
      }
    }
    return found;
  }

  /* ============ ORKESTRATÖR ============ */
  const queue = [];
  let running = false;

  function setEmp(id, status, note, taskId) {
    state.states[id] = { status, note: note || STATUS_LABEL[status], taskId, at: Date.now() };
    renderOffice();
    if (state.selectedEmp === id) renderEmpCard();
  }
  function log(task, message, employeeId) {
    task.log.push({ at: now(), employeeId, message });
    if (task.log.length > 120) task.log.shift();
    persist(task); renderTasks();
  }
  function setTask(task, patch) { Object.assign(task, patch); persist(task); renderTasks(); }

  function enqueue(job) { activeLocal.add(job.id); queue.push(job); pump(); }
  async function pump() {
    if (running) return;
    running = true;
    try {
      while (queue.length) {
        const job = queue.shift();
        const task = state.tasks.get(job.id);
        if (!task) { activeLocal.delete(job.id); continue; }
        try {
          if (job.stage === "plan") await planStage(task, job.note);
          else if (job.stage === "exec") await execStage(task);
          else if (job.stage === "fix") await userFixStage(task, job.target, job.note);
        } catch (e) { failTask(task, e); }
        finally { if (!queue.some((j) => j.id === task.id)) activeLocal.delete(task.id); renderDetail(true); }
      }
    } finally { running = false; }
  }

  function errText(e) {
    if (!e) return "Bilinmeyen hata";
    if (e.code) {
      const map = {
        not_granted: "Claude kullanımına izin verilmedi. Sayfanın izinlerinden Claude'a izin verip tekrar dene.",
        rate_limited: e.reason === "usage_limit" ? "Claude kullanım hakkın doldu. Hakkın yenilenince tekrar dene ya da küçük iş modunu seç." : "Çok fazla istek gitti. Biraz bekleyip tekrar dene.",
        refused: "Claude bu isteği reddetti. İş tanımını değiştirip tekrar dene.",
        invalid_json: "Yanıt okunamadı. İşi yeniden çalıştır.",
        prompt_too_large: "İş metni çok uzun. Malzemeyi kısaltıp tekrar dene.",
        session_expired: "Oturum süresi doldu. Sayfayı yenileyip tekrar giriş yap.",
        sampling_disabled: "Bu hesapta Claude kullanılamıyor.",
        cancelled: "İptal edildi.",
        empty_completion: "Claude boş yanıt verdi. İşi sadeleştirip tekrar dene.",
      };
      return map[e.code] || "Geçici bir hata oluştu (" + e.code + "). Tekrar dene.";
    }
    return e.message || String(e);
  }
  const FATAL = ["not_granted", "sampling_disabled", "session_expired", "rate_limited"];

  function failTask(task, e) {
    const msg = errText(e);
    setTask(task, { status: "failed", error: msg });
    log(task, `İş durdu: ${msg}`, MANAGER.id);
    for (const id of Object.keys(state.states)) if (state.states[id].taskId === task.id && !["idle", "resting"].includes(state.states[id].status)) setEmp(id, "idle");
  }
  const opts = (task) => DEPTH[task.depth || "teslim"].opts;
  function noteModel(task, res) {
    if (state.mode !== "live" || task.modelNote) return;
    const want = opts(task).model;
    task.modelNote = res.modelApplied ? `Yanıtlayan model: ${res.modelApplied}` : `İstenen model (${want}) bu görünümde doğrulanamadı; hesabının izin verdiği en yakın model yanıtlamış olabilir.`;
    log(task, task.modelNote);
  }

  async function planStage(task, note) {
    const be = backend();
    setTask(task, { status: "planning", error: null });
    setEmp(MANAGER.id, "planning", note ? "Planı düzeltiyor" : "İşi planlıyor", task.id);
    log(task, note ? `Plan düzeltme notu: "${note}"` : `İş alındı: "${task.title}"`, MANAGER.id);
    const plan = normalizePlan(await be.json(planPrompt(task, note), opts(task), { kind: "plan", task }), task);
    setTask(task, { plan, results: plan.steps.map((s) => ({ stepId: s.id, employeeId: s.employeeId, status: "pending" })), review: null, report: null });
    log(task, `Plan hazır: ${plan.steps.length} adım, ${new Set(plan.steps.map((s) => s.phase)).size} faz. ${plan.summary}`, MANAGER.id);
    if (task.planFirst) {
      setTask(task, { status: "awaiting" });
      setEmp(MANAGER.id, "idle", "Planı onaya sundu");
      if (state.selectedTask === task.id) { state.tab = "plan"; renderDetail(true); }
      return;
    }
    await execStage(task);
  }

  async function runStep(task, step, prompt, label) {
    const be = backend();
    const emp = EMP[step.employeeId];
    const res = task.results.find((r) => r.stepId === step.id);
    Object.assign(res, { status: "running", startedAt: now() });
    setEmp(emp.id, "working", "Düşünüyor…", task.id);
    log(task, `${label}`, emp.id);
    let lastPaint = 0;
    const out = await be.complete(prompt, opts(task), (text) => {
      res.output = text;
      if (state.states[emp.id].note !== step.title) setEmp(emp.id, "working", step.title, task.id);
      const t = Date.now();
      if (t - lastPaint > 400) { lastPaint = t; paintStream(task, "out-" + step.id, text); }
    }, { kind: "step", emp: emp.id });
    noteModel(task, out);
    Object.assign(res, { status: "done", output: out.text, finishedAt: now(), truncated: !!out.truncated });
    setEmp(emp.id, "idle", "Teslim etti");
    return out;
  }

  async function execStage(task) {
    const be = backend();
    const plan = task.plan;
    setTask(task, { status: "running" });
    setEmp(MANAGER.id, "reviewing", "Ekibi takip ediyor", task.id);

    const phases = [...new Set(plan.steps.map((s) => s.phase))].sort((a, b) => a - b);
    const outputs = [];
    for (const phase of phases) {
      const steps = plan.steps.filter((s) => s.phase === phase);
      log(task, `Faz ${phase} başladı: ${steps.map((s) => EMP[s.employeeId].name).join(", ")}`);
      const prior = outputs.slice();
      await Promise.all(steps.map(async (step) => {
        try {
          const out = await runStep(task, step, stepPrompt(task, step, prior), `${step.title} üzerinde çalışıyor`);
          outputs.push({ step, output: out.text, truncated: out.truncated });
          log(task, `${step.title} teslim edildi`, step.employeeId);
        } catch (e) {
          const msg = errText(e), res = task.results.find((r) => r.stepId === step.id);
          Object.assign(res, { status: "failed", output: (e && e.text ? e.text + "\n\n" : "") + "Hata: " + msg, finishedAt: now() });
          outputs.push({ step, output: `(Bu teslim yapılamadı: ${msg})` });
          setEmp(step.employeeId, "idle", "Hata bildirdi");
          log(task, `${step.title} yapılamadı: ${msg}`, step.employeeId);
          if (e && FATAL.includes(e.code)) throw e;
        }
      }));
    }

    // Teslim kontrolü: müşteri kabul eder mi?
    setTask(task, { status: "checking" });
    setEmp(QA.id, "reviewing", "Teslimi kontrol ediyor", task.id);
    log(task, "Teslim kontrolü başladı", QA.id);
    let review = null;
    try {
      const raw = await be.json(reviewPrompt(task, plan, outputs, autoFindings(outputs)), opts(task), { kind: "review", acceptance: plan.acceptance });
      const stepIds = new Set(plan.steps.map((s) => s.id));
      review = {
        passed: !!raw.passed,
        checks: (Array.isArray(raw.checks) ? raw.checks : []).slice(0, 12).map((c) => ({ criterion: String(c.criterion || ""), ok: !!c.ok, note: String(c.note || "") })),
        fixes: (Array.isArray(raw.fixes) ? raw.fixes : []).filter((f) => f && stepIds.has(String(f.stepId)) && f.note).slice(0, 3).map((f) => ({ stepId: String(f.stepId), note: String(f.note), applied: false })),
      };
      setTask(task, { review });
      log(task, review.passed && !review.fixes.length ? "Teslim kontrolü geçti" : `Teslim kontrolü ${review.fixes.length} düzeltme istedi`, QA.id);
    } catch (e) {
      log(task, `Teslim kontrolü yapılamadı: ${errText(e)}`, QA.id);
      if (e && FATAL.includes(e.code)) { setEmp(QA.id, "idle"); throw e; }
    }
    setEmp(QA.id, "idle", "Kontrolü bitirdi");

    // Tek düzeltme turu: yalnızca istenen yer değişir.
    if (review && review.fixes.length) {
      setTask(task, { status: "revising" });
      await Promise.all(review.fixes.map(async (fix) => {
        const step = plan.steps.find((s) => s.id === fix.stepId);
        const entry = outputs.find((o) => o.step.id === step.id);
        const previous = entry ? entry.output : "";
        try {
          const out = await runStep(task, step, fixPrompt(task, step, previous, fix.note, "Kalite kontrolün"), `Düzeltiyor: ${fix.note}`);
          if (entry) Object.assign(entry, { output: out.text, truncated: out.truncated });
          fix.applied = true;
          const res = task.results.find((r) => r.stepId === step.id); res.revised = true;
          log(task, `${step.title} düzeltildi`, step.employeeId);
        } catch (e) {
          const res = task.results.find((r) => r.stepId === step.id);
          Object.assign(res, { status: "done", output: previous });
          setEmp(step.employeeId, "idle", "Düzeltemedi");
          log(task, `${step.title} düzeltilemedi: ${errText(e)}`, step.employeeId);
          if (e && FATAL.includes(e.code)) throw e;
        }
      }));
      setTask(task, { review });
    }

    // Rapor
    setTask(task, { status: "collecting" });
    setEmp(MANAGER.id, "collecting", "Sonucu topluyor", task.id);
    let lastPaint = 0;
    const rep = await be.complete(reportPrompt(task, plan, outputs, review, taskFiles(task)), opts(task), (text) => {
      task.report = text;
      const t = Date.now();
      if (t - lastPaint > 400) { lastPaint = t; paintStream(task, "reportBody", text); }
    }, { kind: "report" });
    setTask(task, { status: "done", report: rep.text });
    setEmp(MANAGER.id, "idle", "Raporu teslim etti");
    log(task, "Teslim raporu hazır", MANAGER.id);
    if (state.selectedTask === task.id) { state.tab = taskFiles(task).length ? "files" : "report"; renderDetail(true); }
  }

  /* İş sahibinin noktasal düzeltmesi: yalnızca söylenen yer değişir. */
  async function userFixStage(task, target, note) {
    const be = backend();
    task.fixes = task.fixes || [];
    task.fixes.push({ at: now(), target, note });
    setTask(task, { status: "revising", error: null });
    let changed = null;
    if (target !== "report") {
      const step = task.plan.steps.find((s) => s.id === target);
      const res = task.results.find((r) => r.stepId === target);
      const previous = res.output || "";
      try {
        const out = await runStep(task, step, fixPrompt(task, step, previous, note, "İş sahibinin"), `Düzeltiyor: ${note}`);
        res.revised = true;
        changed = `### ${EMP[step.employeeId].name} - ${step.title}\n${clip(out.text, 40000)}`;
        log(task, `${step.title} düzeltildi`, step.employeeId);
      } catch (e) {
        Object.assign(res, { status: "done", output: previous });
        setEmp(step.employeeId, "idle");
        throw e;
      }
    }
    setTask(task, { status: "collecting" });
    setEmp(MANAGER.id, "collecting", "Raporu güncelliyor", task.id);
    const previousReport = task.report || "";
    let lastPaint = 0;
    try {
      const rep = await be.complete(reportFixPrompt(task, previousReport, note, changed), opts(task), (text) => {
        task.report = text;
        const t = Date.now();
        if (t - lastPaint > 400) { lastPaint = t; paintStream(task, "reportBody", text); }
      }, { kind: "report" });
      setTask(task, { status: "done", report: rep.text });
      log(task, "Rapor güncellendi", MANAGER.id);
    } catch (e) {
      task.report = previousReport;
      setEmp(MANAGER.id, "idle");
      throw e;
    }
    setEmp(MANAGER.id, "idle", "Raporu teslim etti");
  }

  // Uzun süre boşta kalanlar yatakhaneye geçer (görsel tat)
  setInterval(() => {
    const BEDS = 5;
    let resting = Object.values(state.states).filter((s) => s.status === "resting").length;
    for (const [id, s] of Object.entries(state.states)) {
      if (resting >= BEDS) break;
      if (s.status === "idle" && Date.now() - s.at > 5 * 60000) { setEmp(id, "resting"); resting++; }
    }
  }, 30000);

  /* ============ İZOMETRİK OFİS ============ */
  const T = 72, WALL = 46, COS = 0.866;
  const iso = (x, y, z = 0) => ({ x: (x - y) * T * COS, y: (x + y) * T * 0.5 - z });
  const pts = (arr) => arr.map((p) => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const rectPoly = (x, y, w, h, z = 0) => pts([iso(x, y, z), iso(x + w, y, z), iso(x + w, y + h, z), iso(x, y + h, z)]);
  const line = (a, b, stroke, w = 1) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${stroke}" stroke-width="${w}"/>`;
  const wall = (a, b, fill) => `<polygon points="${pts([a, b, { x: b.x, y: b.y - WALL }, { x: a.x, y: a.y - WALL }])}" fill="${fill}" stroke="rgba(10,10,12,.85)" stroke-width="1.4" stroke-linejoin="round"/>` + line({ x: a.x, y: a.y - WALL }, { x: b.x, y: b.y - WALL }, "#0a0a0c", 2.2);
  const BED_COLORS = ["#c4a7d9", "#9fc5e8", "#d9b38c", "#f4a7b9", "#a8d8b9"];

  function deskSvg(x, y, active, color) {
    const H = 22, w = 1, h = 0.5, x0 = x - w / 2, y0 = y - h / 2, m = iso(x, y - 0.05, H);
    return `<g>
      <polygon points="${pts([iso(x0, y0 + h), iso(x0 + w, y0 + h), iso(x0 + w, y0 + h, H), iso(x0, y0 + h, H)])}" fill="#8f867d"/>
      <polygon points="${pts([iso(x0 + w, y0), iso(x0 + w, y0 + h), iso(x0 + w, y0 + h, H), iso(x0 + w, y0, H)])}" fill="#a89f95"/>
      <polygon points="${rectPoly(x0, y0, w, h, H)}" fill="#d6cfc6" stroke="#6b645d" stroke-width=".6"/>
      <g transform="translate(${m.x},${m.y})">
        <rect x="-1.5" y="-6" width="3" height="6" fill="#1f1f23"/>
        <rect x="-11" y="-20" width="22" height="14" rx="1.5" fill="#15151a" stroke="#2b2b31"/>
        <rect x="-9.5" y="-18.5" width="19" height="11" rx="1" fill="${active ? color : "#2a2f3a"}" ${active ? 'class="screen-on" filter="url(#glow)" opacity=".9"' : ""}/>
      </g></g>`;
  }
  function plantSvg(x, y) {
    const p = iso(x, y);
    return `<g transform="translate(${p.x},${p.y})" pointer-events="none"><ellipse rx="7" ry="3.5" fill="rgba(0,0,0,.25)"/><rect x="-5" y="-9" width="10" height="9" rx="2" fill="#b5651d"/><circle cy="-15" r="8" fill="#2f855a"/><circle cx="-5" cy="-11" r="6" fill="#38a169"/><circle cx="5" cy="-12" r="6" fill="#276749"/></g>`;
  }
  function bedSvg(x, y, i) {
    const w = 0.6, h = 1.25, H = 12, x0 = x - w / 2, y0 = y - 0.25;
    return `<g><polygon points="${pts([iso(x0, y0 + h), iso(x0 + w, y0 + h), iso(x0 + w, y0 + h, H), iso(x0, y0 + h, H)])}" fill="#7c6f64"/>
      <polygon points="${pts([iso(x0 + w, y0), iso(x0 + w, y0 + h), iso(x0 + w, y0 + h, H), iso(x0 + w, y0, H)])}" fill="#9a8c7f"/>
      <polygon points="${rectPoly(x0, y0, w, h, H)}" fill="${BED_COLORS[i % BED_COLORS.length]}" stroke="#5c524a" stroke-width=".6"/>
      <polygon points="${rectPoly(x0 + 0.08, y0 + 0.08, w - 0.16, 0.28, H + 1)}" fill="#fff" opacity=".9"/></g>`;
  }
  function personSvg(e, s, color, x, y, layer) {
    const p = iso(x, y), status = s.status, busy = !["idle", "resting"].includes(status), selected = state.selectedEmp === e.id;
    const tagW = e.name.length * 6 + 24, note = s.note || "", bubbleW = Math.min(170, note.length * 5.6 + 30);
    let inner = "";
    if (layer === "body") {
      inner += `<ellipse cy="1" rx="11" ry="4.5" fill="rgba(0,0,0,.35)"/>`;
      if (selected) inner += `<ellipse cy="1" rx="15" ry="6.5" fill="none" stroke="#fbbf24" stroke-width="2"/>`;
      inner += status === "resting"
        ? `<g><rect x="-10" y="-10" width="20" height="9" rx="4" fill="${color}"/><circle cx="13" cy="-7" r="6" fill="#f1c9a5"/><text x="16" y="-18" font-size="9" fill="#e5e7eb" class="zz">zZ</text></g>`
        : `<g class="body"><rect x="-7" y="-26" width="14" height="20" rx="5" fill="${color}"/><rect x="-7" y="-13" width="6" height="13" rx="2" fill="#1f2937"/><rect x="1" y="-13" width="6" height="13" rx="2" fill="#1f2937"/><circle cy="-33" r="7.5" fill="#f1c9a5"/><path d="M-7.5 -35 a7.5 7.5 0 0 1 15 0 v-1 a7.5 5 0 0 0 -15 0z" fill="#2b1d14"/>${e.manager ? '<rect x="-2" y="-24" width="4" height="10" fill="#111" rx="1"/>' : ""}</g>`;
    } else {
      inner += `<g transform="translate(0,-50)"><rect x="${-tagW / 2}" y="-8" width="${tagW}" height="16" rx="8" fill="rgba(18,18,22,.9)" stroke="rgba(255,255,255,.08)"/><circle cx="${-tagW / 2 + 9}" r="3.2" fill="${STATUS_COLOR[status]}" ${busy ? 'class="pulse"' : ""}/><text x="4" y="3.5" text-anchor="middle" fill="#fafaf9" font-size="9.5" font-weight="600">${esc(e.name)}</text></g>`;
      if (busy) inner += `<g transform="translate(0,-76)"><path d="M-5 9 L0 15 L5 9 Z" fill="#fff"/><rect x="${-bubbleW / 2}" y="-10" width="${bubbleW}" height="20" rx="6" fill="#fff"/><text x="-6" y="3.5" text-anchor="middle" fill="#18181b" font-size="9">${esc(note.length > 28 ? note.slice(0, 27) + "…" : note)}</text><g transform="translate(${bubbleW / 2 - 14},0)" class="dots"><circle r="1.6" fill="#18181b"/><circle cx="4.5" r="1.6" fill="#18181b"/><circle cx="9" r="1.6" fill="#18181b"/></g></g>`;
    }
    return `<g class="emp ${status}" data-emp="${e.id}" transform="translate(${p.x},${p.y})" style="cursor:pointer">${inner}</g>`;
  }

  function renderOffice() {
    const gridW = Math.max(...DEPARTMENTS.map((d) => d.x + d.w)), gridH = Math.max(...DEPARTMENTS.map((d) => d.y + d.h));
    const rest = DEPARTMENTS.find((d) => d.kind === "rest");
    const beds = Array.from({ length: 5 }, (_, i) => ({ x: rest.x + 0.55 + i * 0.85, y: rest.y + 0.6 }));
    const resting = EMPLOYEES.filter((e) => state.states[e.id].status === "resting");
    const items = [], tags = [];
    for (const e of EMPLOYEES) {
      const d = DEPT[e.dept], s = state.states[e.id];
      const dx = d.x + e.desk[0], dy = d.y + e.desk[1];
      const bi = resting.indexOf(e), bed = bi >= 0 ? beds[bi] : null;
      items.push({ depth: dx + dy, svg: deskSvg(dx, dy, !["idle", "resting"].includes(s.status), d.color) });
      const px = bed ? bed.x : dx, py = bed ? bed.y + 0.5 : dy + 0.62;
      items.push({ depth: px + py + 0.01, svg: personSvg(e, s, d.color, px, py, "body") });
      tags.push(personSvg(e, s, d.color, px, py, "tags"));
    }
    beds.forEach((b, i) => items.push({ depth: b.x + b.y - 0.3, svg: bedSvg(b.x, b.y, i) }));
    items.sort((a, b) => a.depth - b.depth);

    const m = 0.7;
    const minX = iso(-m, gridH + m).x - 40, maxX = iso(gridW + m, -m).x + 40, minY = -WALL - 60, maxY = iso(gridW + m, gridH + m).y + 60;
    let out = `<defs><linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece9e4"/><stop offset="1" stop-color="#d9d4cc"/></linearGradient><linearGradient id="lawn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4d7c4a"/><stop offset="1" stop-color="#36613a"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
    out += `<polygon points="${rectPoly(-m, -m, gridW + 2 * m, gridH + 2 * m)}" fill="url(#lawn)"/><polygon points="${rectPoly(-0.25, -0.25, gridW + 0.5, gridH + 0.5)}" fill="#b9b3aa"/>`;
    for (const d of DEPARTMENTS) {
      out += `<polygon points="${rectPoly(d.x, d.y, d.w, d.h)}" fill="${d.kind === "rest" ? "#cbbfae" : "url(#floor)"}" stroke="#8f8a83" stroke-width=".8"/>`;
      for (let i = 1; i < d.w; i++) out += line(iso(d.x + i, d.y), iso(d.x + i, d.y + d.h), "rgba(0,0,0,.08)");
      for (let i = 1; i < d.h; i++) out += line(iso(d.x, d.y + i), iso(d.x + d.w, d.y + i), "rgba(0,0,0,.08)");
      out += `<polyline points="${pts([iso(d.x, d.y + d.h), iso(d.x + d.w, d.y + d.h), iso(d.x + d.w, d.y)])}" fill="none" stroke="${d.color}" stroke-width="3" opacity=".9"/>`;
    }
    for (const d of DEPARTMENTS) if (d.kind !== "rest") out += wall(iso(d.x, d.y), iso(d.x + d.w, d.y), "rgba(255,255,255,.10)") + wall(iso(d.x, d.y), iso(d.x, d.y + d.h), "rgba(255,255,255,.07)");
    for (const d of DEPARTMENTS) if (d.kind !== "rest") out += plantSvg(d.x + d.w - 0.3, d.y + 0.3);
    out += items.map((i) => i.svg).join("");
    out += `<g pointer-events="none">` + DEPARTMENTS.filter((d) => d.kind !== "rest").map((d) => wall(iso(d.x, d.y + d.h), iso(d.x + d.w, d.y + d.h), "rgba(255,255,255,.035)") + wall(iso(d.x + d.w, d.y), iso(d.x + d.w, d.y + d.h), "rgba(255,255,255,.035)")).join("") + `</g>`;
    out += tags.join("");
    for (const d of DEPARTMENTS) {
      const p = iso(d.x + d.w / 2, d.y + d.h), w = d.name.length * 6.4 + 26;
      out += `<g transform="translate(${p.x - w / 2},${p.y + 11})" pointer-events="none"><rect y="-9" width="${w}" height="18" rx="4" fill="rgba(18,18,22,.92)" stroke="rgba(255,255,255,.12)"/><rect x="6" y="-4" width="8" height="8" rx="2" fill="${d.color}"/><text x="19" y="4" fill="#f5f5f4" font-size="10.5" font-weight="600" letter-spacing=".5">${esc(d.name.toLocaleUpperCase("tr"))}</text></g>`;
    }
    const svg = $("office");
    svg.setAttribute("viewBox", `${minX} ${minY} ${maxX - minX} ${maxY - minY}`);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.innerHTML = out;
    const active = Object.values(state.states).filter((s) => !["idle", "resting"].includes(s.status)).length;
    $("statActive").textContent = active + " aktif";
  }

  function renderEmpCard() {
    const el = $("empCard");
    const e = EMP[state.selectedEmp];
    if (!e) { el.hidden = true; return; }
    const d = DEPT[e.dept], s = state.states[e.id];
    el.hidden = false;
    el.innerHTML = `<div class="head"><span class="swatch" style="background:${d.color}"></span><div><strong>${esc(e.name)}</strong><div class="note">${esc(e.role)} · ${esc(d.name)}</div></div><button class="x" id="empClose" aria-label="Kapat">×</button></div><p>${esc(e.skills)}</p><div class="note">Durum: <b>${esc(STATUS_LABEL[s.status])}</b>${s.note && s.note !== STATUS_LABEL[s.status] ? " · " + esc(s.note) : ""}</div>`;
    $("empClose").onclick = () => { state.selectedEmp = null; renderEmpCard(); renderOffice(); };
  }

  /* ============ PANEL ============ */
  const md = (text) => {
    if (!text) return "";
    try { if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(text, { async: false })); } catch { /* düş */ }
    return `<pre style="white-space:pre-wrap">${esc(text)}</pre>`;
  };
  const sortedTasks = () => [...state.tasks.values()].sort((a, b) => (b.createdAt || "").localeCompare(a.createdAt || ""));
  const currentTask = () => state.tasks.get(state.selectedTask) || sortedTasks()[0] || null;

  function paintStream(task, elId, text) {
    if (state.selectedTask !== task.id) return;
    const el = document.getElementById(elId);
    if (el) { el.innerHTML = md(text); el.classList.add("stream"); }
  }

  function renderTasks() {
    const all = sortedTasks();
    $("tasksEmpty").hidden = all.length > 0;
    $("taskList").innerHTML = all.map((t) => `<li class="${t.id === state.selectedTask ? "active" : ""}" data-task="${t.id}"><span class="status ${t.status}">${TASK_LABEL[t.status] || t.status}</span><span class="title">${esc(t.title)}</span><span class="time">${t.createdAt ? fmtTime(t.createdAt) : ""}</span></li>`).join("");
    $("statOpen").textContent = all.filter((t) => !FINAL.includes(t.status)).length + " açık iş";
    renderDetail();
  }

  const mark = (ok) => (ok === true ? '<span class="mark-ok">✓</span>' : ok === false ? '<span class="mark-bad">✗</span>' : '<span class="mark-q">•</span>');
  const fmtSize = (n) => (n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " KB");

  function specHtml(t) {
    const sp = t.spec || {}, pl = t.plan || {};
    const row = (k, v, proposed) => (v ? `<dt>${k}</dt><dd>${esc(v)}${proposed ? ' <span class="warnline">(öneri)</span>' : ""}</dd>` : "");
    const acc = pl.acceptance && pl.acceptance.length ? pl.acceptance.join("\n") : sp.acceptance;
    return `<dl class="spec">${row("Kim için", sp.audience || pl.audience, !sp.audience && !!pl.audience)}${row("Malzeme", sp.material ? (sp.material.length > 220 ? sp.material.slice(0, 220) + "…" : sp.material) : "")}${row("Teslim biçimi", sp.format || pl.format, !sp.format && !!pl.format)}${row("Kabul ölçütü", acc, !sp.acceptance && !!acc)}</dl>`;
  }

  function planTab(t) {
    let h = "";
    if (!t.plan) return `<div class="note">Genel Müdür planı hazırlıyor…</div>`;
    h += `<p class="note">${esc(t.plan.summary)}</p>`;
    for (const s of t.plan.steps) {
      const r = (t.results || []).find((x) => x.stepId === s.id) || { status: "pending" };
      const lbl = { running: "çalışıyor", done: r.revised ? "düzeltildi" : "teslim", failed: "hata" }[r.status] || "bekliyor";
      const key = t.id + ":" + s.id, open = r.status === "running" || ui.open.has(key);
      h += `<details class="step ${r.status}" data-key="${key}" ${open ? "open" : ""}><summary><span class="phase">F${s.phase}</span><span class="who">${esc(EMP[s.employeeId]?.name || s.employeeId)}</span><span class="what">${esc(s.title)}</span><span class="pill ${r.status}">${lbl}</span></summary>
        <div class="instruction"><b>Teslim:</b> ${esc(s.deliverable || s.title)}<br><b>Hedef:</b> ${esc(s.instruction)}${s.format ? `<br><b>Biçim:</b> ${esc(s.format)}` : ""}${s.acceptance && s.acceptance.length ? `<br><b>Kabul ölçütü:</b> ${esc(s.acceptance.join("; "))}` : ""}</div>
        ${r.status !== "pending" ? `<div class="md ${r.status === "running" ? "stream" : ""}" id="out-${s.id}">${md(r.output)}</div>` : ""}</details>`;
    }
    if (t.status === "awaiting") {
      h += `<div class="card"><h4>Plan onayı</h4><div class="note">Yanlış anlaşılma varsa şimdi düzelt; çalışanlar onayından sonra başlar. "(öneri)" yazan brif parçalarını Genel Müdür önerdi.</div>
        <textarea id="planNote" placeholder="Değişmesini istediğin yeri söyle. Örn: Logo işini Grafik Tasarımcı yapsın, kabul ölçütüne 'tek renk' ekle." style="margin-top:8px;min-height:64px">${esc(ui.planNote)}</textarea>
        <div class="actions"><button class="primary" data-act="approve">Planı onayla ve başlat</button><button class="ghost" data-act="replan">Planı düzelt</button><button class="ghost" data-act="delete">Vazgeç</button></div></div>`;
    }
    return h;
  }

  function reviewCard(t) {
    const rv = t.review;
    if (!rv) return t.status === "checking" ? `<div class="card"><h4>Teslim kontrolü</h4><div class="note">QA teslimleri kabul ölçütüne göre denetliyor…</div></div>` : "";
    const fixes = rv.fixes && rv.fixes.length ? `<h4 style="margin-top:10px">Kontrolün istediği düzeltmeler</h4><ul>${rv.fixes.map((f) => `<li>${mark(f.applied ? true : null)}<span>${esc(f.note)} <span class="note">(${f.applied ? "uygulandı" : "bekliyor"})</span></span></li>`).join("")}</ul>` : "";
    return `<div class="card"><h4>Teslim kontrolü · ${rv.passed ? "kabul edilebilir" : "eksik bulundu"}</h4><ul>${rv.checks.map((c) => `<li>${mark(c.ok)}<span><b>${esc(c.criterion)}</b>${c.note ? " · " + esc(c.note) : ""}</span></li>`).join("")}</ul>${fixes}${rv.fixes && rv.fixes.length ? `<div class="note" style="margin-top:8px">Düzeltmelerden sonra ikinci bir kontrol yapılmadı; teslimi kendin de aç.</div>` : ""}</div>`;
  }

  function filesTab(t) {
    const files = taskFiles(t);
    if (!files.length) return `<div class="note">Bu işte dosya teslimi yok. Metin teslimleri Plan ve Rapor sekmelerinde.</div>`;
    return files.map((f, i) => {
      const key = t.id + ":" + f.name, open = ui.preview === key;
      const canPreview = f.ext === "html" || f.ext === "svg";
      let prev = "";
      if (open && f.ext === "svg") {
        const clean = window.DOMPurify ? DOMPurify.sanitize(f.content, { USE_PROFILES: { svg: true, svgFilters: true } }) : "";
        prev = `<div class="preview"><div class="svgprev"><div class="big">${clean}</div><div><div class="small">${clean}</div><div class="cap">32 px</div></div></div></div>`;
      } else if (open && f.ext === "html") {
        prev = `<div class="preview"><iframe sandbox="allow-scripts" title="${esc(f.name)} önizleme" data-file="${i}"></iframe></div><div class="note" style="margin-top:6px">Önizleme boş kalırsa dosyayı indirip tarayıcıda aç.</div>`;
      }
      return `<div class="file"><div class="row"><div><div class="name">${esc(f.name)}</div><div class="meta">${esc(EMP[f.by]?.name || "")} · ${fmtSize(new Blob([f.content]).size)}</div></div>
        <div class="actions" style="margin:0">${canPreview ? `<button class="ghost" data-file-act="preview" data-file="${i}">${open ? "Kapat" : "Önizle"}</button>` : ""}${downloads ? `<button class="ghost" data-file-act="save" data-file="${i}">İndir</button>` : ""}<button class="ghost" data-file-act="copy" data-file="${i}">Kopyala</button></div></div>${prev}</div>`;
    }).join("");
  }

  function reportTab(t) {
    let h = "";
    if (t.error) h += `<div class="error" style="margin-bottom:10px">${esc(t.error)}</div>`;
    h += reviewCard(t);
    h += `<div class="md report ${t.status === "collecting" ? "stream" : ""}" id="reportBody">${md(t.report)}</div>`;
    if (t.status === "done" && t.plan) {
      h += `<div class="card" style="margin-top:12px"><h4>Düzeltme iste</h4><div class="note">Beğenmediğin yeri söyle; baştan yazılmaz, yalnızca orası değişir.</div>
        <div class="row" style="margin-top:8px"><label class="tier">Nerede
          <select id="fixTarget"><option value="report">Rapor</option>${t.plan.steps.map((s) => `<option value="${s.id}" ${ui.fixTarget === s.id ? "selected" : ""}>${esc(EMP[s.employeeId].name)} · ${esc(s.title.slice(0, 40))}</option>`).join("")}</select></label></div>
        <textarea id="fixNote" placeholder="Örn: Başlık küçük kalmış, ikinci bölüm uzun." style="margin-top:8px;min-height:64px">${esc(ui.fixNote)}</textarea>
        <div class="actions"><button class="primary" data-act="fix">Sadece bunu düzelt</button></div></div>`;
    }
    return h;
  }

  function renderDetail(force) {
    const el = $("detail");
    const t = currentTask();
    if (!t) { el.hidden = true; ui.lastHtml = ""; return; }
    if (state.selectedTask !== t.id) state.selectedTask = t.id;
    el.hidden = false;
    const tab = state.tab, nFiles = taskFiles(t).length;
    const body = tab === "plan" ? planTab(t) : tab === "log" ? `<ul class="log">${(t.log || []).map((l) => `<li><span class="time">${new Date(l.at).toLocaleTimeString("tr-TR")}</span>${l.employeeId ? `<span class="who">${esc(EMP[l.employeeId]?.name || "")}</span>` : ""}<span>${esc(l.message)}</span></li>`).join("")}</ul>` : tab === "files" ? filesTab(t) : reportTab(t);
    const canRetry = FINAL.includes(t.status);
    const html = `<div class="head"><h3>${esc(t.title)}</h3><span class="status ${t.status}">${TASK_LABEL[t.status] || t.status}</span></div>
      ${specHtml(t)}
      <div class="note">Model: ${esc(DEPTH[t.depth || "teslim"].label)}${t.modelNote ? " · " + esc(t.modelNote) : ""}</div>
      <div class="tabs"><button data-tab="plan" class="${tab === "plan" ? "on" : ""}">Plan${t.plan ? ` (${t.plan.steps.length})` : ""}</button><button data-tab="log" class="${tab === "log" ? "on" : ""}">Akış</button><button data-tab="files" class="${tab === "files" ? "on" : ""}">Teslimler${nFiles ? ` (${nFiles})` : ""}</button><button data-tab="report" class="${tab === "report" ? "on" : ""}" ${t.report || t.error || t.review || ["checking", "collecting"].includes(t.status) ? "" : "disabled"}>Rapor</button></div>
      <div id="tabBody">${body}</div>
      ${canRetry ? `<div class="actions"><button class="ghost" data-act="retry">Yeniden çalıştır</button><button class="ghost" data-act="delete">Sil</button></div>` : ""}`;
    if (!force && html === ui.lastHtml) return;
    ui.lastHtml = html;
    el.innerHTML = html;
    // önizleme çerçevesini doldur
    const fr = el.querySelector("iframe[data-file]");
    if (fr) { const f = taskFiles(t)[+fr.dataset.file]; if (f) fr.srcdoc = f.content; }
  }

  // Panel olayları (tek yerden)
  $("detail").addEventListener("click", async (ev) => {
    const t = currentTask();
    if (!t) return;
    const tabBtn = ev.target.closest("[data-tab]");
    if (tabBtn && !tabBtn.disabled) { state.tab = tabBtn.dataset.tab; renderDetail(true); return; }
    const fa = ev.target.closest("[data-file-act]");
    if (fa) {
      const f = taskFiles(t)[+fa.dataset.file];
      if (!f) return;
      const act = fa.dataset.fileAct;
      if (act === "preview") { const key = t.id + ":" + f.name; ui.preview = ui.preview === key ? null : key; renderDetail(true); }
      else if (act === "copy") {
        try { await navigator.clipboard.writeText(f.content); fa.textContent = "Kopyalandı"; }
        catch { fa.textContent = "Kopyalanamadı"; }
        setTimeout(() => { fa.textContent = "Kopyala"; }, 1500);
      } else if (act === "save" && downloads) {
        fa.disabled = true;
        try { await downloads.save({ filename: f.name, data: f.content }); fa.textContent = "İndirildi"; }
        catch (e) { fa.textContent = e && e.code === "declined" ? "Vazgeçildi" : "İndirilemedi"; }
        setTimeout(() => { fa.textContent = "İndir"; fa.disabled = false; }, 1800);
      }
      return;
    }
    const a = ev.target.closest("[data-act]");
    if (!a) return;
    const act = a.dataset.act;
    if (act === "delete") { a.textContent = "Siliniyor…"; removeTask(t.id); }
    else if (act === "retry") submitTask({ title: t.title, spec: t.spec, depth: t.depth, planFirst: t.planFirst });
    else if (act === "approve" && t.status === "awaiting") { ui.planNote = ""; setTask(t, { status: "queued" }); log(t, "Plan onaylandı", MANAGER.id); enqueue({ id: t.id, stage: "exec" }); }
    else if (act === "replan" && t.status === "awaiting") {
      const note = ui.planNote.trim();
      if (!note) { const n = $("planNote"); if (n) { n.focus(); n.placeholder = "Önce neyin değişeceğini yaz."; } return; }
      ui.planNote = ""; setTask(t, { status: "queued" }); enqueue({ id: t.id, stage: "plan", note });
    } else if (act === "fix" && t.status === "done") {
      const note = ui.fixNote.trim();
      if (!note) { const n = $("fixNote"); if (n) { n.focus(); n.placeholder = "Önce neyin değişeceğini yaz."; } return; }
      const target = ui.fixTarget; ui.fixNote = "";
      state.tab = target === "report" ? "report" : "plan";
      if (target !== "report") ui.open.add(t.id + ":" + target);
      setTask(t, { status: "queued" }); enqueue({ id: t.id, stage: "fix", target, note });
    }
  });
  $("detail").addEventListener("input", (ev) => {
    if (ev.target.id === "planNote") ui.planNote = ev.target.value;
    if (ev.target.id === "fixNote") ui.fixNote = ev.target.value;
    if (ev.target.id === "fixTarget") ui.fixTarget = ev.target.value;
  });
  $("detail").addEventListener("toggle", (ev) => {
    const d = ev.target;
    if (d && d.dataset && d.dataset.key) { if (d.open) ui.open.add(d.dataset.key); else ui.open.delete(d.dataset.key); }
  }, true);

  function render() { renderOffice(); renderTasks(); renderEmpCard(); }

  /* ============ İŞ OLUŞTURMA ============ */
  function submitTask({ title, spec, depth, planFirst }) {
    const task = { id: uid(), title, spec: { ...spec }, depth: depth || "teslim", planFirst: !!planFirst, status: "queued", createdAt: now(), updatedAt: now(), results: [], log: [], fixes: [], plan: null, review: null, report: null, error: null };
    state.tasks.set(task.id, task);
    state.selectedTask = task.id; state.tab = "plan"; ui.fixTarget = "report";
    persist(task); renderTasks();
    enqueue({ id: task.id, stage: "plan" });
    return task;
  }

  $("templates").innerHTML = TEMPLATES.map((t, i) => `<button type="button" class="chip" data-tpl="${i}">${esc(t.name)}</button>`).join("");
  $("templates").addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-tpl]");
    if (!b) return;
    const t = TEMPLATES[+b.dataset.tpl];
    $("title").value = t.title; $("audience").value = t.audience; $("material").value = t.material; $("format").value = t.format; $("acceptance").value = t.acceptance;
    $("formError").hidden = true;
    $("title").focus();
  });
  $("newTask").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const v = (id) => $(id).value.trim();
    const title = v("title"), spec = { audience: v("audience"), material: v("material"), format: v("format"), acceptance: v("acceptance") };
    const err = $("formError");
    const fail = (msg) => { err.hidden = false; err.textContent = msg; };
    if (!title) return fail("İşi tek cümleyle yaz: ne teslim edilecek?");
    const all = [title, spec.audience, spec.material, spec.format, spec.acceptance].join("\n");
    if (/\[[^\]\n]{2,}\]/.test(all)) return fail("Köşeli parantezli yerleri kendi işinle doldur; doldurmazsan sonuç da sıradan çıkar.");
    if (all.length > 60000) return fail("Malzeme çok uzun. En gerekli kısmı bırak.");
    err.hidden = true;
    submitTask({ title, spec, depth: $("depth").value, planFirst: $("planFirst").checked });
    for (const id of ["title", "audience", "material", "format", "acceptance"]) $(id).value = "";
  });
  $("taskList").addEventListener("click", (ev) => {
    const li = ev.target.closest("[data-task]");
    if (!li) return;
    state.selectedTask = li.dataset.task;
    const t = state.tasks.get(li.dataset.task);
    state.tab = t && t.status === "done" ? (taskFiles(t).length ? "files" : "report") : "plan";
    ui.preview = null; ui.fixTarget = "report";
    renderTasks();
  });
  $("office").addEventListener("click", (ev) => {
    const g = ev.target.closest("[data-emp]");
    if (!g) return;
    state.selectedEmp = state.selectedEmp === g.dataset.emp ? null : g.dataset.emp;
    renderOffice(); renderEmpCard();
  });

  /* ============ BAŞLATMA ============ */
  function setMode(mode) {
    state.mode = mode;
    const b = $("modeBadge");
    b.className = "badge " + mode;
    b.textContent = mode === "live" ? "CANLI · Claude" : mode === "mock" ? "SİMÜLASYON" : "Bağlanıyor…";
    $("costNote").textContent = mode === "live"
      ? "Her iş kendi Claude hakkından harcar: plan, her çalışan için bir çağrı, teslim kontrolü, gerekirse bir düzeltme turu ve rapor. Soru ve küçük düzeltmede Opus 5.5'i seç; hakkın asıl işe kalsın."
      : mode === "mock" ? "Claude bağlantısı yok; çalışanlar simüle ediliyor. Sayfayı Claude içinde açınca gerçek ekip devreye girer." : "";
  }

  render();
  setMode("wait");
  requestAnimationFrame(() => { const w = $("officeWrap"); if (w.scrollWidth > w.clientWidth) w.scrollLeft = (w.scrollWidth - w.clientWidth) / 2; });

  (async () => {
    const cap = window.claude && typeof window.claude.use === "function" ? window.claude : null;
    if (!cap) { setMode("mock"); loadLocal(); return; }
    const [s, d, dl] = await Promise.all([cap.use("sample").catch(() => null), cap.use("db").catch(() => null), cap.use("downloads").catch(() => null)]);
    sample = s; downloads = dl;
    setMode(sample ? "live" : "mock");
    if (d) {
      db = d;
      let settled = false;
      const timer = setTimeout(() => { if (!settled) loadLocal(); }, 10000);
      try {
        db.collection("tasks").orderBy("createdAt", "desc").limit(30).onSnapshot((snap) => {
          settled = true; clearTimeout(timer);
          ingestStored(snap.docs.map((x) => x.data()));
          const ids = new Set(snap.docs.map((x) => x.id));
          for (const id of [...state.tasks.keys()]) if (!ids.has(id) && !activeLocal.has(id) && !snap.metadata.hasPendingWrites) state.tasks.delete(id);
          renderTasks();
        }, (e) => { console.warn("db dinleyici hatası", e); settled = true; clearTimeout(timer); loadLocal(); });
      } catch (e) { console.warn(e); loadLocal(); }
    } else {
      loadLocal();
    }
  })();

  function loadLocal() {
    try { ingestStored(JSON.parse(localStorage.getItem(LS_KEY) || "[]")); } catch { /* yoksay */ }
    renderTasks();
  }
})();
</script>
